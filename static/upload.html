<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов - Файлообменник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-file-transfer"></i> Файлообменник
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/"><i class="fas fa-home"></i> Список файлов</a>
                <a class="nav-link active" href="/upload"><i class="fas fa-upload"></i> Загрузить</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="fas fa-upload"></i> Загрузка файлов</h2>
        
        <div class="card">
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Выберите файл или папку:</label>
                        <input class="form-control" type="file" id="file" name="file" required>
                        <div class="form-text">Вы можете загружать как файлы, так и папки</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="folder" class="form-label">Папка для загрузки (необязательно):</label>
                        <input class="form-control" type="text" id="folder" name="folder" placeholder="Путь к папке">
                        <div class="form-text">Оставьте пустым для загрузки в корневую директорию</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-upload"></i> Загрузить
                    </button>
                </form>
            </div>
        </div>
        
        <div id="uploadResult" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('uploadResult');
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> Файл успешно загружен!
                        </div>
                    `;
                    // Обновляем список файлов
                    window.location.href = '/';
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">Ошибка загрузки: ${data.error}</div>
                    `;
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки:', error);
                const resultDiv = document.getElementById('uploadResult');
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">Произошла ошибка при загрузке файла</div>
                `;
            });
        });
    </script>
</body>
</html>
